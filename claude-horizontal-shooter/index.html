<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONIC RAY - 横スクロールシューティング</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0a0a12; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #wrap { text-align: center; }
  canvas {
    background: #000; image-rendering: pixelated;
    max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 40px rgba(80, 160, 255, 0.25);
  }
  #help { color: #667; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="450"></canvas>
  <div id="help">移動: ←↑→↓ / WASD | ショット: Z or SPACE (押しっぱなし可) | 決定: ENTER</div>
</div>
<script>
'use strict';
const W = 800, H = 450;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ---------------- ユーティリティ ----------------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function overlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

// ---------------- 入力 ----------------
const keys = {};
let enterEdge = false;
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'Enter' && !keys['Enter']) enterEdge = true;
  keys[e.key] = true;
  if (e.key.length === 1) keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => {
  keys[e.key] = false;
  if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
});
const inp = {
  up:    () => keys['ArrowUp'] || keys['w'],
  down:  () => keys['ArrowDown'] || keys['s'],
  left:  () => keys['ArrowLeft'] || keys['a'],
  right: () => keys['ArrowRight'] || keys['d'],
  shot:  () => keys['z'] || keys[' '],
};

// ---------------- ステージ定義 ----------------
const STAGES = [
  {
    name: 'STAGE 1  草原地帯グリーンフィールド',
    length: 6200, scroll: 1.3, seed: 101,
    sky: ['#7ec8ff', '#cfeaff'], far: '#5a8f6e', ground: '#3e7a4a', groundEdge: '#7fce8a',
    caveCeil: false,
    story: [
      '西暦2199年。辺境コロニー〈アヴァロン〉は',
      '機械生命体〈ヴォイド〉の軍勢に制圧された。',
      '',
      '最後の希望、試作戦闘機「ソニックレイ」。',
      'パイロットのリオは単機、奪還作戦に飛び立つ。',
      '',
      '―― まずは占領された草原地帯を突破せよ。',
    ],
    clearStory: [
      '草原の制圧部隊を撃破した。',
      '',
      'リオ「敵の補給線は地下に伸びている……',
      '      この洞窟が〈巣〉へ続いているはず」',
      '',
      '管制「気をつけて。洞窟内は岩壁が迫っている。',
      '      天井の鍾乳石にも注意して」',
    ],
  },
  {
    name: 'STAGE 2  地底洞窟アビスケイブ',
    length: 6600, scroll: 1.45, seed: 202,
    sky: ['#0a0a1e', '#141430'], far: '#232348', ground: '#3a3358', groundEdge: '#8a7ac8',
    caveCeil: true,
    story: [
      '地表の防衛線を抜け、ソニックレイは',
      '暗く狭い地底洞窟へと降下する。',
      '',
      '岩壁が牙のように迫り、',
      '闇の奥では無数のセンサーがこちらを見ている。',
      '',
      '―― 狭い通路を抜け、〈巣〉の入口へ。',
    ],
    clearStory: [
      '洞窟の主〈深淵の眼〉を撃破。',
      '',
      'リオ「見えた……これが〈ヴォイド〉の心臓部、',
      '      機械要塞コア・シタデルか」',
      '',
      '管制「中枢コアを破壊すれば全機能が停止する。',
      '      最終作戦を開始して。……無事に帰って」',
    ],
  },
  {
    name: 'STAGE 3  機械要塞コア・シタデル',
    length: 7000, scroll: 1.6, seed: 303,
    sky: ['#1a0508', '#2e0a10'], far: '#4a1a22', ground: '#4d3038', groundEdge: '#d86a5a',
    caveCeil: true,
    story: [
      '眼前にそびえる鋼鉄の要塞。',
      '砲台が並び、隔壁が行く手を阻む。',
      '',
      'リオ「ここを抜ければ、全部終わる」',
      '',
      '―― 要塞中枢へ突入し、コアを破壊せよ。',
    ],
    clearStory: [],
  },
];
const ENDING = [
  '中枢コア、撃破――。',
  '',
  '要塞は光に包まれ、静かに機能を停止した。',
  'コロニー〈アヴァロン〉の空に、朝日が戻る。',
  '',
  'リオ「帰投する。……ただいま、アヴァロン」',
  '',
  '                THE END',
  '',
  '      Thank you for playing!',
];

// ---------------- 地形 ----------------
const TSTEP = 16;
let terrain = null; // { floor: [], ceil: [], n }
function genTerrain(si) {
  const st = STAGES[si];
  const rng = mulberry32(st.seed);
  const n = Math.ceil((st.length + W + 400) / TSTEP) + 2;
  const floor = new Array(n), ceil = new Array(n);
  if (si === 0) {
    // なだらかな丘 + 時々山
    let base = 380;
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      let y = 385 + Math.sin(x * 0.004) * 22 + Math.sin(x * 0.011 + 2) * 14;
      if (Math.floor(x / 900) % 3 === 2) y -= 55 * Math.max(0, Math.sin((x % 900) / 900 * Math.PI)); // 山
      floor[i] = clamp(y + (rng() - 0.5) * 6, 250, 430);
      ceil[i] = -50; // 天井なし
    }
  } else if (si === 1) {
    // 洞窟: 上下の壁がうねり、狭い通路が出現
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      const mid = 225 + Math.sin(x * 0.0035) * 70 + Math.sin(x * 0.0012 + 1) * 40;
      let gap = 235 - Math.max(0, Math.sin(x * 0.0016 + 3)) * 105; // 周期的に狭まる
      gap += Math.sin(x * 0.02) * 10;
      gap = clamp(gap, 118, 300);
      floor[i] = clamp(mid + gap / 2 + (rng() - 0.5) * 14, 120, 440);
      ceil[i]  = clamp(mid - gap / 2 + (rng() - 0.5) * 14, 10, 330);
    }
  } else {
    // 機械要塞: 段差状のブロック地形と垂直シャフト
    let f = 380, c = 60;
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      if (i % 10 === 0) { f = 300 + Math.floor(rng() * 4) * 35; c = 40 + Math.floor(rng() * 4) * 30; }
      // 時々、上下から突き出す隔壁
      const block = Math.floor(x / 1300);
      if (block % 2 === 1) {
        const t = (x % 1300) / 1300;
        if (t > 0.45 && t < 0.62) { f = Math.min(f, 270); c = Math.max(c, 165); }
      }
      floor[i] = f; ceil[i] = c;
    }
  }
  terrain = { floor, ceil, n };
}
function floorAt(wx) {
  const i = clamp(Math.floor(wx / TSTEP), 0, terrain.n - 2);
  const t = (wx - i * TSTEP) / TSTEP;
  return terrain.floor[i] * (1 - t) + terrain.floor[i + 1] * t;
}
function ceilAt(wx) {
  const i = clamp(Math.floor(wx / TSTEP), 0, terrain.n - 2);
  const t = (wx - i * TSTEP) / TSTEP;
  return terrain.ceil[i] * (1 - t) + terrain.ceil[i + 1] * t;
}
function hitTerrain(wx, y, pad) {
  return y + pad > floorAt(wx) || y - pad < ceilAt(wx);
}

// ---------------- ゲーム状態 ----------------
let state = 'title'; // title | story | play | clearstory | gameover | ending
let stageIdx = 0;
let scrollX = 0;
let frame = 0;
let score = 0;
let hiScore = +(localStorage.getItem('sonicray_hi') || 0);
let lives = 3;
let storyLines = [], storyNext = '';
let flashT = 0, shakeT = 0;
let stageBanner = 0;

const player = {
  x: 100, y: 225, w: 26, h: 14,
  speedLv: 0, power: 1, missile: false, shield: 0,
  inv: 0, cool: 0, missileCool: 0, alive: true, deadT: 0,
};
let bullets = [], ebullets = [], enemies = [], items = [], particles = [], events = [];
let boss = null, bossWarnT = 0;
let itemCycle = 0;

// ---------------- イベント(出現スクリプト)生成 ----------------
function genEvents(si) {
  const st = STAGES[si];
  const rng = mulberry32(st.seed * 7 + 5);
  events = [];
  let x = 500;
  while (x < st.length - 900) {
    const r = rng();
    if (si === 0) {
      if (r < 0.30) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.55) events.push({ x, type: 'zako', count: 3 });
      else if (r < 0.75) events.push({ x, type: 'turret' });
      else events.push({ x, type: 'hover' });
    } else if (si === 1) {
      if (r < 0.25) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.45) events.push({ x, type: 'stalactite', count: 2 + Math.floor(rng() * 2) });
      else if (r < 0.65) events.push({ x, type: 'zako', count: 4 });
      else if (r < 0.85) events.push({ x, type: 'turret' });
      else events.push({ x, type: 'hover' });
    } else {
      if (r < 0.22) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.45) events.push({ x, type: 'turret', dual: true });
      else if (r < 0.62) events.push({ x, type: 'hover' });
      else if (r < 0.82) events.push({ x, type: 'zako', count: 4, fast: true });
      else events.push({ x, type: 'crusher' });
    }
    x += 380 + rng() * 320;
  }
  events.sort((a, b) => a.x - b.x);
}

// ---------------- 敵の生成 ----------------
function spawnEvent(ev) {
  const sx = scrollX + W + 40;
  switch (ev.type) {
    case 'zako': {
      const y0 = 60 + Math.random() * 280;
      for (let i = 0; i < (ev.count || 3); i++) {
        enemies.push({
          type: 'zako', x: W + 40 + i * 34, y: y0, w: 22, h: 16, hp: 1,
          vx: -(ev.fast ? 3.4 : 2.4), t: i * 10, score: 100,
        });
      }
      break;
    }
    case 'wave': {
      for (let i = 0; i < 5; i++) {
        enemies.push({
          type: 'wave', x: W + 40 + i * 38, y: 0, baseY: 90 + Math.random() * 240,
          w: 20, h: 18, hp: 1, vx: -2.8, t: i * 9, score: 150,
          carry: ev.carry && i === 4,
        });
      }
      break;
    }
    case 'turret': {
      const wx = sx;
      enemies.push({ type: 'turret', wx, x: 0, y: 0, w: 26, h: 20, hp: 4, t: Math.floor(Math.random() * 60), score: 300 });
      if (ev.dual && STAGES[stageIdx].caveCeil) {
        enemies.push({ type: 'turret', wx: wx + 60, ceil: true, x: 0, y: 0, w: 26, h: 20, hp: 4, t: 30, score: 300 });
      }
      break;
    }
    case 'hover': {
      enemies.push({
        type: 'hover', x: W + 40, y: 70 + Math.random() * 260, w: 30, h: 24,
        hp: 3, t: 0, phase: 0, score: 400,
      });
      break;
    }
    case 'stalactite': {
      for (let i = 0; i < (ev.count || 2); i++) {
        const wx = sx + i * 110 + Math.random() * 50;
        enemies.push({ type: 'stalactite', wx, x: 0, y: 0, w: 16, h: 34, hp: 2, vy: 0, fell: false, score: 200 });
      }
      break;
    }
    case 'crusher': {
      const wx = sx;
      enemies.push({ type: 'crusher', wx, x: 0, y: 100 + Math.random() * 200, w: 34, h: 60, hp: 999, invuln: true, t: 0, score: 0 });
      break;
    }
  }
}

// ---------------- ボス ----------------
function spawnBoss(si) {
  bossWarnT = 120;
  if (si === 0) {
    boss = {
      name: '装甲飛行艇 アイアンロック', hp: 70, maxHp: 70,
      x: W + 100, y: 200, w: 110, h: 70, t: 0, si,
    };
  } else if (si === 1) {
    boss = {
      name: '洞窟の主 深淵の眼', hp: 90, maxHp: 90,
      x: W + 100, y: 225, w: 90, h: 90, t: 0, si,
    };
  } else {
    boss = {
      name: '中枢防衛システム コア・シタデル', hp: 130, maxHp: 130,
      x: W + 140, y: 225, w: 120, h: 150, t: 0, si, open: 0,
    };
  }
}
function updateBoss() {
  const b = boss;
  b.t++;
  if (b.x > W - 150) { b.x -= 1.5; return; } // 登場
  const aimAng = Math.atan2(player.y - b.y, player.x - b.x);
  if (b.si === 0) {
    b.y = 200 + Math.sin(b.t * 0.02) * 120;
    if (b.t % 75 === 0) {
      for (let i = -1; i <= 1; i++) {
        const a = aimAng + i * 0.22;
        ebullets.push({ x: b.x - 40, y: b.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 5 });
      }
    }
    if (b.t % 130 === 0) {
      ebullets.push({ x: b.x - 20, y: b.y + 30, vx: -2.2, vy: 1.5, r: 6, bomb: true });
      ebullets.push({ x: b.x - 20, y: b.y - 30, vx: -2.2, vy: -1.5, r: 6 });
    }
  } else if (b.si === 1) {
    b.x = W - 150 + Math.sin(b.t * 0.013) * 60;
    b.y = 225 + Math.sin(b.t * 0.021) * 110;
    if (b.t % 100 === 0) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + b.t * 0.01;
        ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, r: 5 });
      }
    }
    if (b.t % 150 === 70) {
      ebullets.push({ x: b.x, y: b.y, vx: -2, vy: 0, r: 6, homing: 120 });
      ebullets.push({ x: b.x, y: b.y - 30, vx: -2, vy: 0, r: 6, homing: 120 });
    }
  } else {
    b.y = 225 + Math.sin(b.t * 0.008) * 60;
    b.open = (Math.floor(b.t / 150) % 2 === 1) ? 1 : 0; // 開閉: 開いている時だけダメージ
    if (b.open && b.t % 40 === 0) {
      const a = aimAng;
      ebullets.push({ x: b.x - 55, y: b.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, r: 5 });
    }
    if (b.t % 90 === 0) {
      for (let i = -2; i <= 2; i++) {
        ebullets.push({ x: b.x - 30, y: b.y + i * 40, vx: -2.6, vy: i * 0.3, r: 5 });
      }
    }
    if (b.t % 200 === 100) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ebullets.push({ x: b.x - 20, y: b.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, r: 4 });
      }
    }
  }
}
function bossHit(dmg) {
  const b = boss;
  if (b.si === 2 && !b.open) return false; // 閉じている間は無敵
  b.hp -= dmg;
  if (b.hp <= 0) {
    addScore(5000 * (b.si + 1));
    explode(b.x, b.y, 40, '#ffd080');
    shakeT = 40; flashT = 12;
    boss = null;
    setTimeout2(90, () => stageClear());
  }
  return true;
}
// 疑似 setTimeout(フレーム基準)
let timers = [];
function setTimeout2(f, fn) { timers.push({ f, fn }); }

// ---------------- 共通処理 ----------------
function addScore(v) {
  score += v;
  if (score > hiScore) { hiScore = score; localStorage.setItem('sonicray_hi', hiScore); }
}
function explode(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 25, color });
  }
}
function dropItem(x, y) {
  const types = ['P', 'S', 'M', 'B'];
  const t = types[itemCycle % types.length];
  itemCycle++;
  items.push({ x, y, w: 20, h: 20, type: t, t: 0 });
}

function startStage(si) {
  stageIdx = si;
  scrollX = 0; frame = 0;
  bullets = []; ebullets = []; enemies = []; items = []; particles = []; timers = [];
  boss = null; bossWarnT = 0;
  genTerrain(si);
  genEvents(si);
  player.x = 100; player.y = 225; player.alive = true; player.inv = 120;
  stageBanner = 150;
  state = 'play';
}
function stageClear() {
  addScore(1000 * (stageIdx + 1) + lives * 500);
  if (stageIdx >= STAGES.length - 1) {
    storyLines = ENDING; storyNext = 'title'; state = 'ending';
  } else {
    storyLines = STAGES[stageIdx].clearStory; storyNext = 'story' + (stageIdx + 1); state = 'clearstory';
  }
}
function playerDie() {
  if (player.inv > 0 || !player.alive) return;
  if (player.shield > 0) { player.shield--; player.inv = 60; flashT = 4; return; }
  player.alive = false; player.deadT = 0;
  explode(player.x, player.y, 30, '#80ccff');
  shakeT = 25;
  player.power = 1; player.missile = false; player.shield = 0; player.speedLv = Math.max(0, player.speedLv - 1);
}
function respawnOrGameOver() {
  lives--;
  if (lives < 0) { state = 'gameover'; return; }
  player.alive = true; player.inv = 150;
  player.x = 100;
  player.y = clamp(225, ceilAt(scrollX + 100) + 30, floorAt(scrollX + 100) - 30);
}

// ---------------- プレイヤー更新 ----------------
function updatePlayer() {
  if (!player.alive) {
    player.deadT++;
    if (player.deadT > 60) respawnOrGameOver();
    return;
  }
  const sp = 2.6 + player.speedLv * 0.6;
  if (inp.up()) player.y -= sp;
  if (inp.down()) player.y += sp;
  if (inp.left()) player.x -= sp;
  if (inp.right()) player.x += sp * 0.9;
  player.x = clamp(player.x, 20, W - 40);
  player.y = clamp(player.y, 16, H - 16);
  if (player.inv > 0) player.inv--;
  if (player.cool > 0) player.cool--;
  if (player.missileCool > 0) player.missileCool--;

  // ショット
  if (inp.shot() && player.cool <= 0) {
    player.cool = 9;
    const bx = player.x + 16, by = player.y;
    if (player.power === 1) {
      bullets.push({ x: bx, y: by, vx: 8, vy: 0 });
    } else if (player.power === 2) {
      bullets.push({ x: bx, y: by - 5, vx: 8, vy: 0 });
      bullets.push({ x: bx, y: by + 5, vx: 8, vy: 0 });
    } else {
      bullets.push({ x: bx, y: by, vx: 8, vy: 0 });
      bullets.push({ x: bx, y: by - 3, vx: 7.6, vy: -1.6 });
      bullets.push({ x: bx, y: by + 3, vx: 7.6, vy: 1.6 });
    }
    if (player.missile && player.missileCool <= 0) {
      player.missileCool = 24;
      bullets.push({ x: player.x, y: player.y + 8, vx: 4.5, vy: 2.6, missile: true });
    }
  }

  // 地形衝突
  if (hitTerrain(scrollX + player.x, player.y, 7)) playerDie();
}

// ---------------- 弾・敵・アイテム更新 ----------------
function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy;
    if (b.missile) b.vy += 0.05;
  }
  bullets = bullets.filter(b => {
    if (b.x > W + 20 || b.y < -20 || b.y > H + 20) return false;
    if (hitTerrain(scrollX + b.x, b.y, 2)) {
      if (b.missile) explode(b.x, b.y, 6, '#ffcc66');
      return false;
    }
    return true;
  });

  for (const eb of ebullets) {
    if (eb.homing && eb.homing > 0 && player.alive) {
      eb.homing--;
      const a = Math.atan2(player.y - eb.y, player.x - eb.x);
      const cur = Math.atan2(eb.vy, eb.vx);
      let d = a - cur;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      const na = cur + clamp(d, -0.05, 0.05);
      const s = Math.hypot(eb.vx, eb.vy);
      eb.vx = Math.cos(na) * s; eb.vy = Math.sin(na) * s;
    }
    eb.x += eb.vx; eb.y += eb.vy;
  }
  ebullets = ebullets.filter(eb =>
    eb.x > -30 && eb.x < W + 60 && eb.y > -30 && eb.y < H + 30 &&
    !hitTerrain(scrollX + eb.x, eb.y, 1)
  );
}

function updateEnemies() {
  for (const e of enemies) {
    e.t = (e.t || 0) + 1;
    switch (e.type) {
      case 'zako':
        e.x += e.vx;
        e.y += Math.sin(e.t * 0.08) * 1.2;
        break;
      case 'wave':
        e.x += e.vx;
        e.y = e.baseY + Math.sin(e.t * 0.09) * 60;
        break;
      case 'turret': {
        e.x = e.wx - scrollX;
        e.y = e.ceil ? ceilAt(e.wx) + 10 : floorAt(e.wx) - 10;
        if (e.x < W && e.x > 60 && e.t % 95 === 0 && player.alive) {
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, r: 4 });
        }
        break;
      }
      case 'hover':
        if (e.phase === 0) { e.x -= 3; if (e.x < W - 200) e.phase = 1; }
        else if (e.phase === 1) {
          if (e.t % 70 === 0 && player.alive) {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6, r: 4 });
          }
          if (e.t > 260) e.phase = 2;
        }
        else { e.x -= 1.2; e.y -= 0.8; }
        break;
      case 'stalactite':
        e.x = e.wx - scrollX;
        if (!e.fell) {
          e.y = ceilAt(e.wx) + 17;
          if (Math.abs(e.x - player.x) < 90 && e.x > player.x) e.fell = true;
        } else {
          e.vy += 0.18; e.y += e.vy;
          if (e.y + 17 > floorAt(e.wx)) {
            explode(e.x, e.y, 8, '#b0a0e0');
            e.hp = 0; e.noScore = true;
          }
        }
        break;
      case 'crusher':
        e.x = e.wx - scrollX;
        e.y += Math.sin(e.t * 0.05) * 2.4;
        e.y = clamp(e.y, ceilAt(e.wx) + 40, floorAt(e.wx) - 40);
        break;
    }
  }

  // プレイヤー弾 vs 敵
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    for (const b of bullets) {
      if (b.dead) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + 4 && Math.abs(b.y - e.y) < e.h / 2 + 4) {
        b.dead = true;
        if (e.invuln) { explode(b.x, b.y, 3, '#8899aa'); continue; }
        e.hp -= b.missile ? 2 : 1;
        if (e.hp <= 0) {
          explode(e.x, e.y, 12, '#ffb060');
          if (!e.noScore) addScore(e.score);
          if (e.carry) dropItem(e.x, e.y);
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // 敵 vs プレイヤー
  if (player.alive && player.inv <= 0) {
    for (const e of enemies) {
      if (e.hp > 0 && overlap(e, player)) { playerDie(); break; }
    }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.x > -80 && e.x < W + 300 && e.y < H + 80);

  // ボス弾/敵弾 vs プレイヤー
  if (player.alive && player.inv <= 0) {
    for (const eb of ebullets) {
      if (dist2(eb.x, eb.y, player.x, player.y) < (eb.r + 6) * (eb.r + 6)) {
        playerDie(); break;
      }
    }
  }

  // プレイヤー弾 vs ボス
  if (boss) {
    for (const b of bullets) {
      if (b.dead) continue;
      if (Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
        b.dead = true;
        if (bossHit(b.missile ? 2 : 1)) explode(b.x, b.y, 4, '#ffe0a0');
        else explode(b.x, b.y, 2, '#8899aa');
        if (!boss) break;
      }
    }
    bullets = bullets.filter(b => !b.dead);
    if (boss && player.alive && player.inv <= 0 && overlap(boss, player)) playerDie();
  }
}

function updateItems() {
  for (const it of items) {
    it.t++;
    it.x -= 1.2;
    it.y += Math.sin(it.t * 0.05) * 0.6;
    if (player.alive && overlap(it, player)) {
      it.got = true;
      addScore(500);
      flashT = 3;
      if (it.type === 'P') player.power = Math.min(3, player.power + 1);
      else if (it.type === 'S') player.speedLv = Math.min(4, player.speedLv + 1);
      else if (it.type === 'M') player.missile = true;
      else if (it.type === 'B') player.shield = Math.min(3, player.shield + 3);
    }
  }
  items = items.filter(it => !it.got && it.x > -30);
}

// ---------------- プレイ更新 ----------------
function updatePlay() {
  const st = STAGES[stageIdx];
  const bossX = st.length - 400;
  if (!boss && scrollX < bossX) {
    scrollX += st.scroll;
    if (scrollX >= bossX) spawnBoss(stageIdx);
  }
  while (events.length && events[0].x < scrollX + 10) spawnEvent(events.shift());

  updatePlayer();
  updateBullets();
  updateEnemies();
  updateItems();
  if (boss && bossWarnT <= 0) updateBoss();
  if (bossWarnT > 0) bossWarnT--;

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life--; }
  particles = particles.filter(p => p.life > 0);
  timers = timers.filter(t => { t.f--; if (t.f <= 0) { t.fn(); return false; } return true; });
  if (stageBanner > 0) stageBanner--;
  if (flashT > 0) flashT--;
  if (shakeT > 0) shakeT--;
  frame++;
}

// ---------------- 描画 ----------------
function drawBackground() {
  const st = STAGES[stageIdx];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, st.sky[0]); g.addColorStop(1, st.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 遠景パララックス
  ctx.fillStyle = st.far;
  const px = scrollX * 0.3;
  if (stageIdx === 0) {
    // 遠くの山
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) {
      const wx = x + px;
      ctx.lineTo(x, 330 - Math.abs(Math.sin(wx * 0.003)) * 90 - Math.sin(wx * 0.009) * 20);
    }
    ctx.lineTo(W, H); ctx.fill();
    // 雲
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260 - scrollX * 0.15) % (W + 200) + W + 200) % (W + 200) - 100;
      const cy = 50 + (i * 47) % 120;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 25, cy - 8, 30, 11, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (stageIdx === 1) {
    // 奥の岩柱ときらめく結晶
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 170 - px) % (W + 160) + W + 160) % (W + 160) - 80;
      ctx.fillStyle = st.far;
      ctx.fillRect(cx, 90 + (i * 53) % 140, 34, 400);
    }
    for (let i = 0; i < 14; i++) {
      const cx = ((i * 111 - scrollX * 0.5) % (W + 60) + W + 60) % (W + 60) - 30;
      const cy = 60 + (i * 97) % 330;
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + i * 2);
      ctx.fillStyle = `rgba(150,140,255,${0.25 + tw * 0.5})`;
      ctx.fillRect(cx, cy, 3, 3);
    }
  } else {
    // 遠景の構造物と警告灯
    for (let i = 0; i < 7; i++) {
      const cx = ((i * 200 - px) % (W + 220) + W + 220) % (W + 220) - 110;
      ctx.fillStyle = st.far;
      ctx.fillRect(cx, 120 + (i * 71) % 90, 80, 400);
      ctx.fillStyle = (Math.floor(frame / 30) + i) % 2 ? '#ff5040' : '#601010';
      ctx.fillRect(cx + 36, 130 + (i * 71) % 90, 8, 8);
    }
  }
}
function drawTerrain() {
  const st = STAGES[stageIdx];
  const i0 = Math.floor(scrollX / TSTEP);
  // 床
  ctx.fillStyle = st.ground;
  ctx.beginPath();
  ctx.moveTo(-20, H + 20);
  for (let i = i0; i <= i0 + Math.ceil(W / TSTEP) + 1; i++) {
    ctx.lineTo(i * TSTEP - scrollX, terrain.floor[Math.min(i, terrain.n - 1)]);
  }
  ctx.lineTo(W + 20, H + 20);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = st.groundEdge; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = i0; i <= i0 + Math.ceil(W / TSTEP) + 1; i++) {
    const x = i * TSTEP - scrollX, y = terrain.floor[Math.min(i, terrain.n - 1)];
    i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // 天井
  if (st.caveCeil) {
    ctx.fillStyle = st.ground;
    ctx.beginPath();
    ctx.moveTo(-20, -20);
    for (let i = i0; i <= i0 + Math.ceil(W / TSTEP) + 1; i++) {
      ctx.lineTo(i * TSTEP - scrollX, terrain.ceil[Math.min(i, terrain.n - 1)]);
    }
    ctx.lineTo(W + 20, -20);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = st.groundEdge;
    ctx.beginPath();
    for (let i = i0; i <= i0 + Math.ceil(W / TSTEP) + 1; i++) {
      const x = i * TSTEP - scrollX, y = terrain.ceil[Math.min(i, terrain.n - 1)];
      i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
function drawPlayer() {
  if (!player.alive) return;
  if (player.inv > 0 && Math.floor(frame / 4) % 2 === 0) return;
  const { x, y } = player;
  // 機体
  ctx.fillStyle = '#cfe8ff';
  ctx.beginPath();
  ctx.moveTo(x + 15, y);
  ctx.lineTo(x - 12, y - 7);
  ctx.lineTo(x - 8, y);
  ctx.lineTo(x - 12, y + 7);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3d8de0';
  ctx.fillRect(x - 4, y - 3, 9, 6);
  // エンジン炎
  ctx.fillStyle = Math.floor(frame / 3) % 2 ? '#ffb040' : '#ff7020';
  ctx.beginPath();
  ctx.moveTo(x - 12, y - 3);
  ctx.lineTo(x - 20 - Math.random() * 5, y);
  ctx.lineTo(x - 12, y + 3);
  ctx.closePath(); ctx.fill();
  // シールド
  if (player.shield > 0) {
    ctx.strokeStyle = `rgba(120,220,255,${0.4 + 0.3 * Math.sin(frame * 0.2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.stroke();
  }
}
function drawEnemies() {
  for (const e of enemies) {
    switch (e.type) {
      case 'zako':
        ctx.fillStyle = '#e05050';
        ctx.beginPath();
        ctx.moveTo(e.x - 11, e.y);
        ctx.lineTo(e.x + 11, e.y - 8);
        ctx.lineTo(e.x + 6, e.y);
        ctx.lineTo(e.x + 11, e.y + 8);
        ctx.closePath(); ctx.fill();
        break;
      case 'wave':
        ctx.fillStyle = e.carry ? '#ff8830' : '#d060d0';
        ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#301030';
        ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
        break;
      case 'turret': {
        ctx.fillStyle = '#889';
        const dir = e.ceil ? 1 : -1;
        ctx.fillRect(e.x - 13, e.y - 10, 26, 20);
        ctx.strokeStyle = '#aab'; ctx.lineWidth = 4;
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16); ctx.stroke();
        break;
      }
      case 'hover':
        ctx.fillStyle = '#50b0a0';
        ctx.beginPath();
        ctx.ellipse(e.x, e.y, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#104038';
        ctx.fillRect(e.x - 5, e.y - 4, 10, 8);
        break;
      case 'stalactite':
        ctx.fillStyle = '#9a8cc8';
        ctx.beginPath();
        ctx.moveTo(e.x - 8, e.y - 17);
        ctx.lineTo(e.x + 8, e.y - 17);
        ctx.lineTo(e.x, e.y + 17);
        ctx.closePath(); ctx.fill();
        break;
      case 'crusher':
        ctx.fillStyle = '#606878';
        ctx.fillRect(e.x - 17, e.y - 30, 34, 60);
        ctx.fillStyle = (Math.floor(frame / 20) % 2) ? '#ff6050' : '#903028';
        ctx.fillRect(e.x - 6, e.y - 6, 12, 12);
        break;
    }
  }
}
function drawBoss() {
  if (!boss) return;
  const b = boss;
  if (b.si === 0) {
    ctx.fillStyle = '#7a6858';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 55, 32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a4a3c';
    ctx.fillRect(b.x - 55, b.y - 8, 30, 16);
    ctx.fillStyle = '#ffcc50';
    ctx.beginPath(); ctx.arc(b.x - 30, b.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a3a30';
    ctx.fillRect(b.x - 10, b.y - 42, 40, 14);
  } else if (b.si === 1) {
    const pulse = 1 + Math.sin(b.t * 0.08) * 0.06;
    ctx.fillStyle = '#5a4a88';
    ctx.beginPath(); ctx.arc(b.x, b.y, 45 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8b8ff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#20103a';
    const a = Math.atan2(player.y - b.y, player.x - b.x);
    ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * 9, b.y + Math.sin(a) * 9, 11, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const sa = b.t * 0.03 + (i / 6) * Math.PI * 2;
      ctx.fillStyle = '#8a7ac8';
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(sa) * 58, b.y + Math.sin(sa) * 58, 8, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = '#5a3a40';
    ctx.fillRect(b.x - 40, b.y - 75, 100, 150);
    ctx.fillStyle = '#7a5058';
    ctx.fillRect(b.x - 55, b.y - 45, 20, 90);
    // コア(開閉)
    if (b.open) {
      ctx.fillStyle = (Math.floor(frame / 8) % 2) ? '#ffe080' : '#ffa040';
      ctx.beginPath(); ctx.arc(b.x - 45, b.y, 14, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#3a2228';
      ctx.fillRect(b.x - 59, b.y - 16, 28, 32);
    }
    for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = '#8a6068';
      ctx.fillRect(b.x - 30, b.y + i * 40 - 5, 24, 10);
    }
  }
  // HPバー
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(150, H - 26, 500, 14);
  ctx.fillStyle = b.hp / b.maxHp > 0.3 ? '#ff5060' : '#ffcc30';
  ctx.fillRect(152, H - 24, 496 * clamp(b.hp / b.maxHp, 0, 1), 10);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
  ctx.fillText(b.name, W / 2, H - 30);
}
function drawBulletsItems() {
  ctx.fillStyle = '#aaffff';
  for (const b of bullets) {
    if (b.missile) {
      ctx.fillStyle = '#ffcc66';
      ctx.fillRect(b.x - 4, b.y - 2, 8, 4);
      ctx.fillStyle = '#aaffff';
    } else {
      ctx.fillRect(b.x - 6, b.y - 1.5, 12, 3);
    }
  }
  for (const eb of ebullets) {
    ctx.fillStyle = eb.homing ? '#ff70e0' : '#ffe060';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#903020';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 0.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const it of items) {
    const colors = { P: '#ff6060', S: '#60c0ff', M: '#ffb040', B: '#70ffb0' };
    ctx.fillStyle = colors[it.type];
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.t * 0.08) * 0.3);
    ctx.fillRect(-10, -10, 20, 20);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(it.type, 0, 5);
    ctx.restore();
  }
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / 30, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, 24);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE ${String(score).padStart(7, '0')}`, 10, 16);
  ctx.fillText(`HI ${String(hiScore).padStart(7, '0')}`, 160, 16);
  ctx.textAlign = 'center';
  ctx.fillText(`STAGE ${stageIdx + 1}`, W / 2, 16);
  ctx.textAlign = 'right';
  let status = `POWER Lv${player.power}  SPD ${player.speedLv}`;
  if (player.missile) status += '  MSL';
  if (player.shield > 0) status += `  BAR×${player.shield}`;
  ctx.fillText(status, W - 90, 16);
  // 残機
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#cfe8ff';

    ctx.lineTo(W - 70 + i * 22, 8);
    ctx.lineTo(W - 70 + i * 22, 16);

  if (stageBanner > 0) {
    ctx.globalAlpha = clamp(Math.min(stageBanner, 150 - stageBanner) / 30, 0, 1);

  if (bossWarnT > 0 && Math.floor(bossWarnT / 15) % 2 === 0) {
    ctx.fillStyle = '#ff4040'; ctx.font = 'bold 34px monospace'; ctx.textAlign = 'center';
    ctx.fillText('WARNING !', W / 2, 200);
  }
}
function drawTextScreen(title, lines, footer) {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);
  // 星
  const rng = mulberry32(42);
  for (let i = 0; i < 80; i++) {
    const x = rng() * W, y = rng() * H;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.6 * Math.abs(Math.sin(frame * 0.02 + i))})`;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.textAlign = 'center';
  if (title) {
    ctx.fillStyle = '#80ccff'; ctx.font = 'bold 30px monospace';
    ctx.fillText(title, W / 2, 90);
  }
  ctx.fillStyle = '#dde'; ctx.font = '16px monospace';
  const y0 = 150;
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y0 + i * 28));
  if (footer && Math.floor(frame / 30) % 2 === 0) {
    ctx.fillStyle = '#ffd060'; ctx.font = '15px monospace';
    ctx.fillText(footer, W / 2, H - 40);
  }
  frame++;
}

// ---------------- メインループ ----------------
function loop() {
  requestAnimationFrame(loop);
  const consume = enterEdge; enterEdge = false;

  if (state === 'title') {
    drawTextScreen('', [], '');
    // タイトル独自描画
    ctx.fillStyle = '#80ccff';
    ctx.font = 'bold 58px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SONIC RAY', W / 2, 170);
    ctx.fillStyle = '#aab';
    ctx.font = '17px monospace';
    ctx.fillText('- 横スクロールシューティング -', W / 2, 210);
    ctx.font = '13px monospace';
    ctx.fillText('移動: ←↑→↓ / WASD   ショット: Z or SPACE', W / 2, 290);
    ctx.fillText('P:パワー  S:スピード  M:ミサイル  B:バリア', W / 2, 315);
    ctx.fillText(`HI SCORE ${String(hiScore).padStart(7, '0')}`, W / 2, 355);
    if (Math.floor(frame / 30) % 2 === 0) {
      ctx.fillStyle = '#ffd060'; ctx.font = '17px monospace';
      ctx.fillText('PRESS ENTER TO START', W / 2, H - 55);
    }
    if (consume) {
      score = 0; lives = 3;
      player.power = 1; player.speedLv = 0; player.missile = false; player.shield = 0;
      itemCycle = 0;
      storyLines = STAGES[0].story; storyNext = 'start0'; state = 'story';
    }
  } else if (state === 'story' || state === 'clearstory' || state === 'ending') {
    const title = state === 'ending' ? 'MISSION COMPLETE'
      : state === 'clearstory' ? 'STAGE CLEAR' : STAGES[stageIdx].name;
    drawTextScreen(title, storyLines, 'PRESS ENTER');
    if (consume) {
      if (storyNext === 'title') state = 'title';
      else if (storyNext.startsWith('start')) startStage(+storyNext.slice(5));
      else if (storyNext.startsWith('story')) {
        const ni = +storyNext.slice(5);
        stageIdx = ni;
        storyLines = STAGES[ni].story; storyNext = 'start' + ni; state = 'story';
      }
    }
  } else if (state === 'gameover') {
    drawTextScreen('GAME OVER', [
      '', `SCORE  ${String(score).padStart(7, '0')}`,
      '', 'リオ「……まだだ、まだ終われない……!」',
    ], 'PRESS ENTER');
    if (consume) state = 'title';
  } else if (state === 'play') {
    updatePlay();
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    drawBackground();
    drawTerrain();
    drawEnemies();
    drawBoss();
    drawPlayer();
    drawBulletsItems();
    ctx.restore();
    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashT * 0.06})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawHUD();
  }
}
genTerrain(0);
loop();
</script>
</body>
</html>
