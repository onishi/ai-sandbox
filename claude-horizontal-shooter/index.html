<script>
'use strict';
const W = 800, H = 450;
const cv = document.getElementById('game');
const mainCtx = cv.getContext('2d');
// 8bit ピクセル風: ワールドは低解像度キャンバスに描いて拡大転送する
const LW = 320, LH = 180;
const off = document.createElement('canvas');
off.width = LW; off.height = LH;
const octx = off.getContext('2d');
let ctx = octx; // 描画先: ワールド=低解像度 / HUD・テキスト=高解像度
const PXU = W / LW; // 1ドット = 2.5 ゲーム座標

// ---------------- ユーティリティ ----------------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function overlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}
function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
  const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
  const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
  return `rgb(${r},${g},${bl})`;
}

// ---------------- ピクセルスプライト ----------------
function drawSprite(rows, pal, cx, cy) {
  const w = rows[0].length, h = rows.length;
  const x0 = Math.round((cx - w * PXU / 2) / PXU) * PXU;
  const y0 = Math.round((cy - h * PXU / 2) / PXU) * PXU;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const k = rows[r][c];
      if (k === '.') continue;
      ctx.fillStyle = pal[k];
      ctx.fillRect(x0 + c * PXU, y0 + r * PXU, PXU + 0.05, PXU + 0.05);
    }
  }
}
function mirrorRows(top, center) { // 上半分+中心行から上下対称スプライトを作る
  return top.concat([center], top.slice().reverse());
}
// 自機「ソニックレイ」: 白 + えんじ色 + 黒縁取りの往年のロボットアニメ風配色。
// 後退角の主翼+翼端ウィングレット、カナード、段付きキャノピー、尾翼、エンジングロー
const SPR_PLAYER = mirrorRows([
  '........................',
  '.or.....................',
  '.oooww..................',
  'o...mwww................',
  'o....mwwww..o..or.......',
  '.oom..mwwwwwmmwkrwwwsso.',
], 'oggmwwwwwwwwwwrrwwwwmsso');
const PAL_PLAYER = {
  o: '#0d0d10', // 輪郭(黒)
  w: '#f7f4ec', // 主装甲(白、わずかに暖色)
  s: '#cfd0d2', // 機首の陰影(ニュートラルグレー)
  m: '#7a0f1c', // アクセントトリム(えんじ色/マルーン)
  r: '#e2202f', // キャノピー/ライン(鮮やかな赤)
  k: '#141014', // コクピット窓の陰
  g: '#ffcf4d', // エンジングロー(琥珀)
};
// 4x5 ミニフォント(アイテム文字用)
const MINI_FONT = {
  P: ['111.', '1..1', '111.', '1...', '1...'],
  S: ['.111', '1...', '.11.', '...1', '111.'],
  M: ['1..1', '1111', '1111', '1..1', '1..1'],
  B: ['111.', '1..1', '111.', '1..1', '111.'],
  O: ['.11.', '1..1', '1..1', '1..1', '.11.'],
  U: ['1..1', '1..1', '1..1', '1..1', '.11.'],
};
function drawMini(chr, cx, cy, color) {
  const rows = MINI_FONT[chr];
  if (!rows) return;
  ctx.fillStyle = color;
  const w = rows[0].length;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < w; c++) {
      if (rows[r][c] === '1') ctx.fillRect(cx + (c - w / 2) * PXU, cy + (r - 2.5) * PXU, PXU + 0.05, PXU + 0.05);
    }
  }
}
function hash1(n) { // 決定的な擬似乱数(地形装飾用)
  n = Math.imul(n ^ 61, 2654435761);
  return ((n >>> 8) % 1000) / 1000;
}
function glow(x, y, r, color, a) {
  ctx.globalAlpha = a;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}
function ridge(par, base, amp, freq, phase) { // 遠景の山並み
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) {
    const wx = x + par;
    ctx.lineTo(x, base - Math.abs(Math.sin(wx * freq + phase)) * amp - Math.sin(wx * freq * 3.1) * amp * 0.2);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawDiamond(x, y, r, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y);
  ctx.closePath(); ctx.fill();
}

// ---------------- サウンド (WebAudio) ----------------
let actx = null, muted = false;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol) {
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = buf;
  const g = actx.createGain(); g.gain.value = vol || 0.15;
  s.connect(g); g.connect(actx.destination); s.start();
}
const SFX = {
  shot:    () => tone(880, 0.05, 'square', 0.02, -400),
  boom:    () => noiseBurst(0.18, 0.1),
  bigboom: () => { noiseBurst(0.55, 0.2); tone(70, 0.55, 'sawtooth', 0.12, -40); },
  item:    () => { tone(660, 0.08, 'square', 0.06); setTimeout(() => tone(990, 0.12, 'square', 0.06), 70); },
  oneup:   () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'square', 0.07), i * 80)),
  die:     () => tone(400, 0.5, 'sawtooth', 0.1, -350),
  warn:    () => { tone(220, 0.25, 'sawtooth', 0.07); setTimeout(() => tone(170, 0.25, 'sawtooth', 0.07), 260); },
  ok:      () => tone(1320, 0.07, 'square', 0.05),
  clear:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.08), i * 100)),
};
function setMuted(m) {
  muted = m;
  document.getElementById('sndToggle').textContent = muted ? '🔇' : '🔊';
}
document.getElementById('sndToggle').addEventListener('click', () => { initAudio(); setMuted(!muted); });

// ---------------- 入力 ----------------
const keys = {};
let enterEdge = false;
addEventListener('keydown', e => {
  initAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'Enter' && !keys['Enter']) enterEdge = true;
  if (e.key === 'm' || e.key === 'M') setMuted(!muted);
  keys[e.key] = true;
  if (e.key.length === 1) keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => {
  keys[e.key] = false;
  if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
});
const vpad = { up: false, down: false, left: false, right: false, shot: false };
const inp = {
  up:    () => keys['ArrowUp'] || keys['w'] || vpad.up,
  down:  () => keys['ArrowDown'] || keys['s'] || vpad.down,
  left:  () => keys['ArrowLeft'] || keys['a'] || vpad.left,
  right: () => keys['ArrowRight'] || keys['d'] || vpad.right,
  shot:  () => keys['z'] || keys[' '] || vpad.shot,
};

// ---------------- バーチャルパッド(タッチ操作) ----------------
// viewport メタがない環境(ラッパー内で表示される場合など)では動的に追加
if (!document.querySelector('meta[name="viewport"]')) {
  const m = document.createElement('meta');
  m.name = 'viewport';
  m.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
  document.head.appendChild(m);
}
function enablePad() { document.body.classList.add('pad-on'); }
// タッチ環境の判定は複数のシグナルで行う
if (('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 ||
    matchMedia('(pointer: coarse)').matches || matchMedia('(any-pointer: coarse)').matches) {
  enablePad();
}
// 判定漏れ対策: 実際に画面がタッチされたら必ず表示する(切替ボタン上のタッチは除く)
const notOnToggle = e => !(e.target && e.target.closest && e.target.closest('#bar'));
addEventListener('touchstart', e => { initAudio(); if (notOnToggle(e)) enablePad(); }, { passive: true });
addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch' && notOnToggle(e)) enablePad();
}, { passive: true });
// 手動切り替えボタン(自動判定が全滅した場合の保険)
document.getElementById('padToggle').addEventListener('click', () => {
  document.body.classList.toggle('pad-on');
});

{
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  const btnA = document.getElementById('btnA');
  const btnStart = document.getElementById('btnStart');
  const R = 44, TH = 14;
  let stickId = null;
  const setStick = e => {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    vpad.left = dx < -TH; vpad.right = dx > TH;
    vpad.up = dy < -TH; vpad.down = dy > TH;
  };
  const resetStick = () => {
    stickId = null;
    knob.style.transform = '';
    vpad.left = vpad.right = vpad.up = vpad.down = false;
  };
  const shotOn = e => {
    e.preventDefault();
    vpad.shot = true;
    if (state !== 'play') enterEdge = true; // メニュー中は決定ボタンとしても機能
  };
  const shotOff = () => { vpad.shot = false; };
  const pressStart = e => { e.preventDefault(); enterEdge = true; };
  if ('PointerEvent' in window) {
    stick.addEventListener('pointerdown', e => {
      e.preventDefault();
      stickId = e.pointerId;
      try { stick.setPointerCapture(e.pointerId); } catch (err) {}
      setStick(e);
    });
    stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) setStick(e); });
    stick.addEventListener('pointerup', e => { if (e.pointerId === stickId) resetStick(); });
    stick.addEventListener('pointercancel', resetStick);
    btnA.addEventListener('pointerdown', shotOn);
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
      btnA.addEventListener(ev, shotOff);
    }
    btnStart.addEventListener('pointerdown', pressStart);
    cv.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' && state !== 'play') enterEdge = true;
    });
  } else {
    // Pointer Events 非対応環境向けの touch フォールバック
    stick.addEventListener('touchstart', e => { e.preventDefault(); setStick(e.touches[0]); }, { passive: false });
    stick.addEventListener('touchmove', e => { e.preventDefault(); setStick(e.touches[0]); }, { passive: false });
    stick.addEventListener('touchend', e => { e.preventDefault(); resetStick(); }, { passive: false });
    stick.addEventListener('touchcancel', resetStick);
    btnA.addEventListener('touchstart', shotOn, { passive: false });
    btnA.addEventListener('touchend', shotOff);
    btnA.addEventListener('touchcancel', shotOff);
    btnStart.addEventListener('touchstart', pressStart, { passive: false });
    cv.addEventListener('touchstart', () => { if (state !== 'play') enterEdge = true; }, { passive: true });
  }
}

// ---------------- 地形 ----------------
const TSTEP = 16;
let terrain = null; // { floor: [], ceil: [], n }
let arenaT = 0;     // ボス戦時に地形が消えて開けたアリーナになる (0=通常, 1=アリーナ)
const arenaEase = () => arenaT * arenaT * (3 - 2 * arenaT);
function genTerrain(si) {
  const st = STAGES[si];
  const rng = mulberry32(st.seed);
  const n = Math.ceil((st.length + W + 400) / TSTEP) + 2;
  const floor = new Array(n), ceil = new Array(n);
  if (si === 0) {
    // なだらかな丘 + 時々山
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      let y = 385 + Math.sin(x * 0.004) * 22 + Math.sin(x * 0.011 + 2) * 14;
      if (Math.floor(x / 900) % 3 === 2) y -= 55 * Math.max(0, Math.sin((x % 900) / 900 * Math.PI)); // 山
      floor[i] = clamp(y + (rng() - 0.5) * 6, 250, 430);
      ceil[i] = -50; // 天井なし
    }
  } else if (si === 1) {
    // 洞窟: 上下の壁がうねり、狭い通路が出現
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      const mid = 225 + Math.sin(x * 0.0035) * 70 + Math.sin(x * 0.0012 + 1) * 40;
      let gap = 235 - Math.max(0, Math.sin(x * 0.0016 + 3)) * 105; // 周期的に狭まる
      gap += Math.sin(x * 0.02) * 10;
      gap = clamp(gap, 118, 300);
      floor[i] = clamp(mid + gap / 2 + (rng() - 0.5) * 14, 120, 440);
      ceil[i]  = clamp(mid - gap / 2 + (rng() - 0.5) * 14, 10, 330);
    }
  } else if (si === 2) {
    // 氷結峡谷: 上下から交互に突き出す鋭い氷柱
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      let f = 398 + Math.sin(x * 0.005) * 16;
      let c = 34 + Math.sin(x * 0.004 + 2) * 14;
      const sp = i % 24;
      if (sp < 5) f -= (2.5 - Math.abs(sp - 2.5)) * 52;
      const sc = (i + 12) % 24;
      if (sc < 5) c += (2.5 - Math.abs(sc - 2.5)) * 52;
      floor[i] = clamp(f + (rng() - 0.5) * 8, 200, 440);
      ceil[i] = clamp(c + (rng() - 0.5) * 8, 6, 260);
    }
  } else if (si === 3) {
    // 嵐の空域: 低くうねる雲海。上は開けた空
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      floor[i] = clamp(408 + Math.sin(x * 0.006) * 16 + Math.sin(x * 0.0021 + 1) * 12 + (rng() - 0.5) * 8, 340, 442);
      ceil[i] = -50;
    }
  } else {
    // 機械要塞: 段差状のブロック地形と隔壁
    let f = 380, c = 60;
    for (let i = 0; i < n; i++) {
      const x = i * TSTEP;
      if (i % 10 === 0) { f = 300 + Math.floor(rng() * 4) * 35; c = 40 + Math.floor(rng() * 4) * 30; }
      const block = Math.floor(x / 1300);
      if (block % 2 === 1) {
        const t = (x % 1300) / 1300;
        if (t > 0.45 && t < 0.62) { f = Math.min(f, 270); c = Math.max(c, 165); }
      }
      floor[i] = f; ceil[i] = c;
    }
  }
  terrain = { floor, ceil, n };
}
function floorAt(wx) {
  const i = clamp(Math.floor(wx / TSTEP), 0, terrain.n - 2);
  const t = (wx - i * TSTEP) / TSTEP;
  const raw = terrain.floor[i] * (1 - t) + terrain.floor[i + 1] * t;
  return raw + (490 - raw) * arenaEase(); // ボス戦時は床が画面外へ沈む
}
function ceilAt(wx) {
  const i = clamp(Math.floor(wx / TSTEP), 0, terrain.n - 2);
  const t = (wx - i * TSTEP) / TSTEP;
  const raw = terrain.ceil[i] * (1 - t) + terrain.ceil[i + 1] * t;
  return raw + (-90 - raw) * arenaEase(); // ボス戦時は天井が画面外へ引き上がる
}
function hitTerrain(wx, y, pad) {
  return y + pad > floorAt(wx) || y - pad < ceilAt(wx);
}
// 地形解析: 敵配置に使う
function floorPeaks(minX, maxX, thresh) { // 床の高所(山頂・氷柱の先端)
  const res = [], f = terrain.floor;
  const i1 = Math.min(Math.floor(maxX / TSTEP), terrain.n - 3);
  for (let i = Math.max(2, Math.ceil(minX / TSTEP)); i < i1; i++) {
    if (f[i] < thresh && f[i] <= f[i - 2] && f[i] <= f[i + 2]) { res.push(i * TSTEP); i += 20; }
  }
  return res;
}
function ceilSpikes(minX, maxX) { // 天井から深く垂れ下がる場所
  const res = [], c = terrain.ceil;
  const i1 = Math.min(Math.floor(maxX / TSTEP), terrain.n - 3);
  for (let i = Math.max(2, Math.ceil(minX / TSTEP)); i < i1; i++) {
    if (c[i] > 100 && c[i] >= c[i - 2] + 8 && c[i] >= c[i + 2] + 8) { res.push(i * TSTEP); i += 8; }
  }
  return res;
}
function narrowGaps(minX, maxX) { // 天井と床が最も狭まる通路
  const res = [], f = terrain.floor, c = terrain.ceil;
  const i1 = Math.min(Math.floor(maxX / TSTEP), terrain.n - 4);
  for (let i = Math.max(3, Math.ceil(minX / TSTEP)); i < i1; i++) {
    const g = f[i] - c[i];
    if (g < 165 && g <= (f[i - 3] - c[i - 3]) - 8 && g <= (f[i + 3] - c[i + 3]) - 8) {
      res.push(i * TSTEP); i += 14;
    }
  }
  return res;
}

// ---------------- イベント(出現スクリプト)生成 ----------------
function pushAt(type, wx, extra) { // 固定座標(wx)に配置する地形連動イベント
  events.push(Object.assign({ x: Math.max(0, wx - W - 80), type, wx }, extra || {}));
}
function genEvents(si) {
  const st = STAGES[si];
  const rng = mulberry32(st.seed * 7 + 5);
  events = [];
  const lenEnd = st.length - 900;

  // 空中敵のランダム編隊
  let x = 450;
  while (x < lenEnd) {
    const r = rng();
    if (si === 0) {
      if (r < 0.34) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.68) events.push({ x, type: 'zako', count: 3 });
      else events.push({ x, type: 'hover' });
    } else if (si === 1) {
      if (r < 0.30) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.60) events.push({ x, type: 'zako', count: 4 });
      else if (r < 0.85) events.push({ x, type: 'hover' });
      else events.push({ x, type: 'stalactite', count: 2 });
    } else if (si === 2) {
      if (r < 0.30) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.60) events.push({ x, type: 'zako', count: 4, fast: true });
      else if (r < 0.90) events.push({ x, type: 'diver' });
      else events.push({ x, type: 'hover' });
    } else if (si === 3) {
      if (r < 0.25) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.55) events.push({ x, type: 'diver' });
      else if (r < 0.80) events.push({ x, type: 'zako', count: 5, fast: true });
      else events.push({ x, type: 'hover' });
    } else {
      if (r < 0.25) events.push({ x, type: 'wave', carry: true });
      else if (r < 0.50) events.push({ x, type: 'hover' });
      else if (r < 0.80) events.push({ x, type: 'zako', count: 4, fast: true });
      else events.push({ x, type: 'turret', dual: true });
    }
    x += 260 + rng() * 200;
  }

  // 地形を活かした配置
  if (si === 0) {
    // 丘や山の頂上に砲台
    for (const wx of floorPeaks(700, lenEnd, 356)) {
      if (rng() < 0.8) pushAt('turretAt', wx);
    }
  } else if (si === 1) {
    // 狭い通路の入口を守る砲台と、通路手前の鍾乳石の罠
    for (const wx of narrowGaps(700, lenEnd)) {
      pushAt('turretAt', wx - 60);
      if (rng() < 0.7) pushAt('turretAt', wx + 40, { ceil: true });
      pushAt('stalactiteAt', wx - 260, { count: 3 });
    }
  } else if (si === 2) {
    // 床の氷柱の先端に砲台、天井の氷柱は真下を通ると落ちてくる
    for (const wx of floorPeaks(700, lenEnd, 340)) {
      if (rng() < 0.55) pushAt('turretAt', wx);
    }
    for (const wx of ceilSpikes(700, lenEnd)) {
      if (rng() < 0.65) pushAt('stalactiteAt', wx, { count: 2 });
    }
  } else if (si === 3) {
    // 雲海に潜み、浮上して撃ってくる伏兵
    for (let wx = 900; wx < lenEnd; wx += 640 + rng() * 260) {
      pushAt('popup', wx);
      if (rng() < 0.4) pushAt('popup', wx + 130);
    }
  } else {
    // 隔壁の狭間にクラッシャー、前後の床と天井に砲台
    for (let bx = 1300; bx + 800 < lenEnd + 900; bx += 2600) {
      const cw = bx + Math.floor(0.53 * 1300);
      pushAt('crusherAt', cw);
      pushAt('turretAt', cw - 240);
      pushAt('turretAt', cw - 170, { ceil: true });
      pushAt('turretAt', cw + 200);
    }
  }

  // 定期的にアイテム運搬機(倒すと必ずアイテムを落とす)
  for (let cx = 750; cx < st.length - 1000; cx += 620 + rng() * 250) {
    events.push({ x: cx, type: 'carrier' });
  }
  events.sort((a, b) => a.x - b.x);
}

// ---------------- 敵の生成 ----------------
function spawnEvent(ev) {
  const sx = scrollX + W + 40;
  switch (ev.type) {
    case 'zako': {
      const y0 = 60 + Math.random() * 280;
      for (let i = 0; i < (ev.count || 3); i++) {
        enemies.push({
          type: 'zako', x: W + 40 + i * 34, y: y0, w: 22, h: 16, hp: 1,
          vx: -(ev.fast ? 3.4 : 2.4), t: i * 10, score: 100,
        });
      }
      break;
    }
    case 'wave': {
      for (let i = 0; i < 5; i++) {
        enemies.push({
          type: 'wave', x: W + 40 + i * 38, y: 0, baseY: 90 + Math.random() * 240,
          w: 20, h: 18, hp: 1, vx: -2.8, t: i * 9, score: 150,
          carry: ev.carry && i === 4,
        });
      }
      break;
    }
    case 'turret': {
      const wx = sx;
      enemies.push({ type: 'turret', wx, x: 0, y: 0, w: 26, h: 20, hp: 4, t: Math.floor(Math.random() * 60), score: 300 });
      if (ev.dual && STAGES[stageIdx].caveCeil) {
        enemies.push({ type: 'turret', wx: wx + 60, ceil: true, x: 0, y: 0, w: 26, h: 20, hp: 4, t: 30, score: 300 });
      }
      break;
    }
    case 'turretAt':
      enemies.push({
        type: 'turret', wx: ev.wx, ceil: ev.ceil, x: 0, y: 0, w: 26, h: 20,
        hp: 4, t: Math.floor(Math.random() * 60), score: 300,
      });
      break;
    case 'hover': {
      enemies.push({
        type: 'hover', x: W + 40, y: 70 + Math.random() * 260, w: 30, h: 24,
        hp: 3, t: 0, phase: 0, score: 400,
      });
      break;
    }
    case 'stalactite': {
      for (let i = 0; i < (ev.count || 2); i++) {
        const wx = sx + i * 110 + Math.random() * 50;
        enemies.push({ type: 'stalactite', wx, x: 0, y: 0, w: 16, h: 34, hp: 2, vy: 0, fell: false, score: 200 });
      }
      break;
    }
    case 'stalactiteAt':
      for (let i = 0; i < (ev.count || 2); i++) {
        const wx = ev.wx + i * 44 - ((ev.count || 2) - 1) * 22;
        enemies.push({ type: 'stalactite', wx, x: 0, y: 0, w: 16, h: 34, hp: 2, vy: 0, fell: false, score: 200 });
      }
      break;
    case 'crusher': {
      const wx = sx;
      enemies.push({ type: 'crusher', wx, x: 0, y: 100 + Math.random() * 200, w: 34, h: 60, hp: 999, invuln: true, t: 0, score: 0 });
      break;
    }
    case 'crusherAt':
      enemies.push({ type: 'crusher', wx: ev.wx, x: 0, y: 225, w: 34, h: 60, hp: 999, invuln: true, t: 0, score: 0 });
      break;
    case 'diver': {
      for (let i = 0; i < 2; i++) {
        enemies.push({
          type: 'diver', x: W - 200 + i * 90 + Math.random() * 60, y: -20 - i * 40,
          w: 20, h: 16, hp: 1, vx: -1.2, vy: 3.4, t: 0, score: 150,
        });
      }
      break;
    }
    case 'popup':
      enemies.push({
        type: 'popup', wx: ev.wx, x: 0, y: 9999, w: 24, h: 18,
        hp: 2, t: 0, t2: 0, phase: 0, score: 250,
      });
      break;
    case 'carrier': {
      enemies.push({
        type: 'carrier', x: W + 40, y: 60 + Math.random() * 300, w: 26, h: 18,
        hp: 2, vx: -1.6, t: 0, score: 300, carry: true,
      });
      break;
    }
  }
}

// ---------------- ボス ----------------
const BOSS_DEFS = [
  { kind: 'gunship', name: '装甲飛行艇 アイアンロック',        hp: 70,  w: 110, h: 70,  entryX: 650 },
  { kind: 'eye',     name: '洞窟の主 深淵の眼',                hp: 95,  w: 90,  h: 90,  entryX: 700 },
  { kind: 'dragon',  name: '氷竜 アイスヴァーン',              hp: 115, w: 64,  h: 64,  entryX: 690, t0: 92 },
  { kind: 'tempest', name: '嵐の暴君 テンペスト',              hp: 130, w: 80,  h: 80,  entryX: 690, t0: 79 },
  { kind: 'core',    name: '中枢防衛システム コア・シタデル', hp: 160, w: 120, h: 150, entryX: 660 },
];
function spawnBoss(si) {
  bossWarnT = 120;
  SFX.warn();
  const d = BOSS_DEFS[si];
  boss = { ...d, maxHp: d.hp, x: W + 120, y: 225, t: d.t0 || 0, entered: false, trail: [], open: 0 };
}
function updateBoss() {
  const b = boss;
  b.t++;
  if (!b.entered) {
    b.x -= 2;
    if (b.x <= b.entryX) b.entered = true;
    else return;
  }
  const aimAng = Math.atan2(player.y - b.y, player.x - b.x);
  if (b.kind === 'gunship') {
    b.y = 200 + Math.sin(b.t * 0.02) * 120;
    if (b.t % 75 === 0) {
      for (let i = -1; i <= 1; i++) {
        const a = aimAng + i * 0.22;
        ebullets.push({ x: b.x - 40, y: b.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 5 });
      }
    }
    if (b.t % 130 === 0) {
      ebullets.push({ x: b.x - 20, y: b.y + 30, vx: -2.2, vy: 1.5, r: 6 });
      ebullets.push({ x: b.x - 20, y: b.y - 30, vx: -2.2, vy: -1.5, r: 6 });
    }
  } else if (b.kind === 'eye') {
    b.x = 650 + Math.sin(b.t * 0.013) * 60;
    b.y = 225 + Math.sin(b.t * 0.021) * 110;
    if (b.t % 100 === 0) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + b.t * 0.01;
        ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, r: 5 });
      }
    }
    if (b.t % 150 === 70) {
      ebullets.push({ x: b.x, y: b.y, vx: -2, vy: 0, r: 6, homing: 120 });
      ebullets.push({ x: b.x, y: b.y - 30, vx: -2, vy: 0, r: 6, homing: 120 });
    }
  } else if (b.kind === 'dragon') {
    b.x = 600 + Math.sin(b.t * 0.017) * 90;
    b.y = 225 + Math.sin(b.t * 0.031) * 150;
    b.trail.unshift({ x: b.x, y: b.y });
    if (b.trail.length > 90) b.trail.pop();
    if (b.t % 80 === 0) {
      for (let i = -1; i <= 1; i++) {
        const a = aimAng + i * 0.2;
        ebullets.push({ x: b.x - 20, y: b.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 5 });
      }
    }
    if (b.t % 140 === 60) {
      for (let k = 0; k < 3; k++) {
        ebullets.push({ x: 120 + Math.random() * 520, y: -10, vx: 0, vy: 2.6 + Math.random(), r: 5 });
      }
    }
  } else if (b.kind === 'tempest') {
    b.x = 620 + Math.sin(b.t * 0.02) * 70;
    b.y = 225 + Math.cos(b.t * 0.027) * 130;
    if (b.t % 70 === 0) {
      for (let i = -1; i <= 1; i += 2) {
        const a = aimAng + i * 0.14;
        ebullets.push({ x: b.x - 20, y: b.y, vx: Math.cos(a) * 3.2, vy: Math.sin(a) * 3.2, r: 5 });
      }
    }
    if (b.t % 110 === 50) {
      // 上下へ走る稲妻弾
      ebullets.push({ x: b.x - 10, y: b.y, vx: -1.5, vy: 5.5, r: 4 });
      ebullets.push({ x: b.x - 10, y: b.y, vx: -1.5, vy: -5.5, r: 4 });
    }
    if (b.t % 190 === 90) {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, r: 4 });
      }
    }
  } else { // core
    b.y = 225 + Math.sin(b.t * 0.008) * 60;
    b.open = (Math.floor(b.t / 150) % 2 === 1) ? 1 : 0; // 開閉: 開いている時だけダメージ
    if (b.open && b.t % 40 === 0) {
      ebullets.push({ x: b.x - 55, y: b.y, vx: Math.cos(aimAng) * 4, vy: Math.sin(aimAng) * 4, r: 5 });
    }
    if (b.t % 90 === 0) {
      for (let i = -2; i <= 2; i++) {
        ebullets.push({ x: b.x - 30, y: b.y + i * 40, vx: -2.6, vy: i * 0.3, r: 5 });
      }
    }
    if (b.t % 200 === 100) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ebullets.push({ x: b.x - 20, y: b.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, r: 4 });
      }
    }
  }
}
function bossHit(dmg) {
  const b = boss;
  if (b.kind === 'core' && !b.open) return false; // 閉じている間は無敵
  b.hp -= dmg;
  if (b.hp <= 0) {
    addScore(5000 * (stageIdx + 1));
    explode(b.x, b.y, 40, '#ffd080');
    SFX.bigboom();
    shakeT = 40; flashT = 12;
    ebullets = [];
    boss = null;
    setTimeout2(90, () => stageClear());
  }
  return true;
}
// 疑似 setTimeout(フレーム基準)
let timers = [];
function setTimeout2(f, fn) { timers.push({ f, fn }); }

// ---------------- 共通処理 ----------------
function addScore(v) {
  score += v;
  if (score > hiScore) { hiScore = score; localStorage.setItem('sonicray_hi', hiScore); }
}
function explode(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 3.5;
    const life = 20 + Math.random() * 25;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, maxLife: life, color, hot: n >= 8 });
  }
  if (n >= 8) particles.push({ ring: true, x, y, r: 4, life: 13, maxLife: 13 }); // 衝撃波リング
}
function dropItem(x, y) {
  const types = ['P', 'S', 'M', 'B', 'O', 'P', 'M', 'S', 'O', 'U'];
  const t = types[itemCycle % types.length];
  itemCycle++;
  items.push({ x, y, w: 20, h: 20, type: t, t: 0 });
}

function startStage(si) {
  stageIdx = si;
  scrollX = 0; frame = 0; arenaT = 0;
  bullets = []; ebullets = []; enemies = []; items = []; particles = []; timers = []; trail = [];
  boss = null; bossWarnT = 0;
  genTerrain(si);
  genEvents(si);
  player.x = 100; player.y = 225; player.alive = true; player.inv = 120;
  stageBanner = 150;
  state = 'play';
}
function stageClear() {
  addScore(1000 * (stageIdx + 1) + lives * 500);
  SFX.clear();
  if (stageIdx >= STAGES.length - 1) {
    storyLines = ENDING; storyNext = 'title'; state = 'ending';
  } else {
    storyLines = STAGES[stageIdx].clearStory; storyNext = 'story' + (stageIdx + 1); state = 'clearstory';
  }
}
function playerDie() {
  if (player.inv > 0 || !player.alive) return;
  if (player.shield > 0) { player.shield--; player.inv = 60; flashT = 4; SFX.boom(); return; }
  player.alive = false; player.deadT = 0;
  explode(player.x, player.y, 30, '#80ccff');
  SFX.die();
  shakeT = 25;
  player.power = 1; player.missileLv = 0; player.shield = 0; player.options = 0;
  player.speedLv = Math.max(0, player.speedLv - 1);
}
function respawnOrGameOver() {
  lives--;
  if (lives < 0) { state = 'gameover'; return; }
  player.alive = true; player.inv = 150;
  player.x = 100;
  player.y = clamp(225, ceilAt(scrollX + 100) + 30, floorAt(scrollX + 100) - 30);
  trail = [];
}

// ---------------- プレイヤー更新 ----------------
function optionPos(k) { // k 番目のオプションの位置(自機の軌跡を遅れて辿る)
  const idx = (k + 1) * 13;
  return trail[Math.min(idx, trail.length - 1)] || { x: player.x - 24 * (k + 1), y: player.y };
}
function updatePlayer() {
  if (!player.alive) {
    player.deadT++;
    if (player.deadT > 60) respawnOrGameOver();
    return;
  }
  const sp = 2.6 + player.speedLv * 0.6;
  if (inp.up()) player.y -= sp;
  if (inp.down()) player.y += sp;
  if (inp.left()) player.x -= sp;
  if (inp.right()) player.x += sp * 0.9;
  // 上下移動に合わせて機体が傾く(なめらかに追従)
  const vertIn = (inp.down() ? 1 : 0) - (inp.up() ? 1 : 0);
  player.tilt += (vertIn - player.tilt) * 0.18;
  if (stageIdx === 3) player.y += Math.sin(frame * 0.012) * 0.7; // 嵐の乱気流
  player.x = clamp(player.x, 20, W - 40);
  player.y = clamp(player.y, 16, H - 16);
  trail.unshift({ x: player.x, y: player.y });
  if (trail.length > 42) trail.pop();
  if (player.inv > 0) player.inv--;
  if (player.cool > 0) player.cool--;
  if (player.missileCool > 0) player.missileCool--;
  if (player.mflash > 0) player.mflash--;

  // ショット(自機 + オプション)
  if (inp.shot() && player.cool <= 0) {
    player.cool = player.power >= 6 ? 7 : 9;
    player.mflash = 4;
    SFX.shot();
    const pts = [{ x: player.x, y: player.y, main: true }];
    for (let k = 0; k < player.options; k++) pts.push({ ...optionPos(k), main: false });
    for (const fp of pts) {
      const bx = fp.x + 16, by = fp.y;
      if (player.power === 1) {
        bullets.push({ x: bx, y: by, vx: 8, vy: 0 });
      } else if (player.power === 2) {
        bullets.push({ x: bx, y: by - 5, vx: 8, vy: 0 });
        bullets.push({ x: bx, y: by + 5, vx: 8, vy: 0 });
      } else if (player.power <= 4) {
        bullets.push({ x: bx, y: by, vx: 8, vy: 0 });
        bullets.push({ x: bx, y: by - 3, vx: 7.6, vy: -1.6 });
        bullets.push({ x: bx, y: by + 3, vx: 7.6, vy: 1.6 });
      } else { // Lv5+: 5方向
        bullets.push({ x: bx, y: by, vx: 8, vy: 0 });
        bullets.push({ x: bx, y: by - 3, vx: 7.6, vy: -1.4 });
        bullets.push({ x: bx, y: by + 3, vx: 7.6, vy: 1.4 });
        bullets.push({ x: bx, y: by - 5, vx: 7.2, vy: -2.8 });
        bullets.push({ x: bx, y: by + 5, vx: 7.2, vy: 2.8 });
      }
      if (fp.main) {
        if (player.power >= 4) bullets.push({ x: fp.x - 14, y: by, vx: -7, vy: 0 }); // 後方
        if (player.power >= 6) { // Lv6: 上下ショット
          bullets.push({ x: fp.x, y: by - 8, vx: 0, vy: -7 });
          bullets.push({ x: fp.x, y: by + 8, vx: 0, vy: 7 });
        }
      }
    }
    if (player.missileLv > 0 && player.missileCool <= 0) {
      player.missileCool = 24;
      bullets.push({ x: player.x, y: player.y + 8, vx: 4.5, vy: 2.6, missile: true });
      if (player.missileLv >= 2) bullets.push({ x: player.x, y: player.y - 8, vx: 4.5, vy: -2.6, missile: true, up: true });
    }
  }

  // 地形衝突
  if (hitTerrain(scrollX + player.x, player.y, 7)) playerDie();
}

// ---------------- 弾・敵・アイテム更新 ----------------
function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy;
    if (b.missile) b.vy += b.up ? -0.05 : 0.05;
  }
  bullets = bullets.filter(b => {
    if (b.x > W + 20 || b.x < -20 || b.y < -20 || b.y > H + 20) return false;
    if (hitTerrain(scrollX + b.x, b.y, 2)) {
      if (b.missile) explode(b.x, b.y, 6, '#ffcc66');
      return false;
    }
    return true;
  });

  for (const eb of ebullets) {
    if (eb.homing && eb.homing > 0 && player.alive) {
      eb.homing--;
      const a = Math.atan2(player.y - eb.y, player.x - eb.x);
      const cur = Math.atan2(eb.vy, eb.vx);
      let d = a - cur;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      const na = cur + clamp(d, -0.05, 0.05);
      const s = Math.hypot(eb.vx, eb.vy);
      eb.vx = Math.cos(na) * s; eb.vy = Math.sin(na) * s;
    }
    eb.x += eb.vx; eb.y += eb.vy;
  }
  ebullets = ebullets.filter(eb =>
    eb.x > -30 && eb.x < W + 60 && eb.y > -30 && eb.y < H + 30 &&
    !hitTerrain(scrollX + eb.x, eb.y, 1)
  );
}

function updateEnemies() {
  for (const e of enemies) {
    e.t = (e.t || 0) + 1;
    switch (e.type) {
      case 'zako':
        e.x += e.vx;
        e.y += Math.sin(e.t * 0.08) * 1.2;
        break;
      case 'wave':
        e.x += e.vx;
        e.y = e.baseY + Math.sin(e.t * 0.09) * 60;
        break;
      case 'turret': {
        e.x = e.wx - scrollX;
        e.y = e.ceil ? ceilAt(e.wx) + 10 : floorAt(e.wx) - 10;
        if (e.x < W && e.x > 60 && e.t % 95 === 0 && player.alive) {
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          const spd = 2.3 + stageIdx * 0.12;
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4 });
        }
        break;
      }
      case 'hover':
        if (e.phase === 0) { e.x -= 3; if (e.x < W - 200) e.phase = 1; }
        else if (e.phase === 1) {
          if (e.t % 70 === 0 && player.alive) {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            const spd = 2.5 + stageIdx * 0.12;
            ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4 });
          }
          if (e.t > 260) e.phase = 2;
        }
        else { e.x -= 1.2; e.y -= 0.8; }
        break;
      case 'stalactite':
        e.x = e.wx - scrollX;
        if (!e.fell) {
          e.y = ceilAt(e.wx) + 17;
          if (Math.abs(e.x - player.x) < 90 && e.x > player.x) e.fell = true;
        } else {
          e.vy += 0.18; e.y += e.vy;
          if (e.y + 17 > floorAt(e.wx)) {
            explode(e.x, e.y, 8, '#b0a0e0');
            e.hp = 0; e.noScore = true;
          }
        }
        break;
      case 'crusher':
        e.x = e.wx - scrollX;
        e.y += Math.sin(e.t * 0.05) * 2.4;
        e.y = clamp(e.y, ceilAt(e.wx) + 40, floorAt(e.wx) - 40);
        break;
      case 'diver':
        e.vy = Math.max(0.2, e.vy - 0.03);
        e.vx = Math.max(-3.4, e.vx - 0.04);
        e.x += e.vx; e.y += e.vy;
        break;
      case 'popup': {
        e.x = e.wx - scrollX;
        const fy = floorAt(e.wx);
        if (e.phase === 0) { e.y = fy + 26; if (e.x < W - 60 && e.x > 0) e.phase = 1; }
        else if (e.phase === 1) { e.y -= 1.3; if (e.y <= fy - 58) e.phase = 2; }
        else if (e.phase === 2) {
          e.t2++;
          if (e.t2 % 55 === 25 && player.alive) {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            const spd = 2.6 + stageIdx * 0.12;
            ebullets.push({ x: e.x, y: e.y - 8, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4 });
          }
          if (e.t2 > 170) e.phase = 3;
        } else {
          e.y += 1.3;
          if (e.y > fy + 26) { e.hp = 0; e.noScore = true; }
        }
        break;
      }
      case 'carrier':
        e.x += e.vx;
        e.y += Math.sin(e.t * 0.04) * 0.8;
        break;
    }
  }

  // プレイヤー弾 vs 敵
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    for (const b of bullets) {
      if (b.dead) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + 4 && Math.abs(b.y - e.y) < e.h / 2 + 4) {
        b.dead = true;
        if (e.invuln) { explode(b.x, b.y, 3, '#8899aa'); continue; }
        e.hp -= b.missile ? 2 : 1;
        if (e.hp <= 0) {
          explode(e.x, e.y, 12, '#ffb060');
          SFX.boom();
          if (!e.noScore) addScore(e.score);
          if (e.carry) dropItem(e.x, e.y);
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // 敵 vs プレイヤー
  if (player.alive && player.inv <= 0) {
    for (const e of enemies) {
      if (e.hp > 0 && overlap(e, player)) { playerDie(); break; }
    }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.x > -80 && e.x < W + 300 && e.y < H + 80);

  // ボス弾/敵弾 vs プレイヤー
  if (player.alive && player.inv <= 0) {
    for (const eb of ebullets) {
      if (dist2(eb.x, eb.y, player.x, player.y) < (eb.r + 6) * (eb.r + 6)) {
        playerDie(); break;
      }
    }
  }

  // プレイヤー弾 vs ボス
  if (boss) {
    for (const b of bullets) {
      if (b.dead) continue;
      if (Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
        b.dead = true;
        if (bossHit(b.missile ? 2 : 1)) explode(b.x, b.y, 4, '#ffe0a0');
        else explode(b.x, b.y, 2, '#8899aa');
        if (!boss) break;
      }
    }
    bullets = bullets.filter(b => !b.dead);
    if (boss && player.alive && player.inv <= 0 && overlap(boss, player)) playerDie();
  }
}

function updateItems() {
  for (const it of items) {
    it.t++;
    it.x -= 1.2;
    it.y += Math.sin(it.t * 0.05) * 0.6;
    if (player.alive && overlap(it, player)) {
      it.got = true;
      addScore(500);
      flashT = 3;
      if (it.type === 'P') { player.power = Math.min(6, player.power + 1); SFX.item(); }
      else if (it.type === 'S') { player.speedLv = Math.min(4, player.speedLv + 1); SFX.item(); }
      else if (it.type === 'M') { player.missileLv = Math.min(2, player.missileLv + 1); SFX.item(); }
      else if (it.type === 'B') { player.shield = Math.min(4, player.shield + 3); SFX.item(); }
      else if (it.type === 'O') { player.options = Math.min(2, player.options + 1); SFX.item(); }
      else if (it.type === 'U') { lives = Math.min(6, lives + 1); SFX.oneup(); }
    }
  }
  items = items.filter(it => !it.got && it.x > -30);
}

// ---------------- プレイ更新 ----------------
function updatePlay() {
  const st = STAGES[stageIdx];
  const bossX = st.length - 400;
  if (!boss && scrollX < bossX) {
    scrollX += st.scroll;
    if (scrollX >= bossX) spawnBoss(stageIdx);
  }
  while (events.length && events[0].x < scrollX + 10) spawnEvent(events.shift());

  // ボス戦: 地形が引いていき、開けたアリーナになる
  if (boss || bossWarnT > 0) arenaT = Math.min(1, arenaT + 0.01);

  updatePlayer();
  updateBullets();
  updateEnemies();
  updateItems();
  if (boss && bossWarnT <= 0) updateBoss();
  if (bossWarnT > 0) {
    if (bossWarnT % 45 === 44) SFX.warn();
    bossWarnT--;
  }

  for (const p of particles) {
    if (p.ring) { p.r += 2.6; p.life--; continue; }
    p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  timers = timers.filter(t => { t.f--; if (t.f <= 0) { t.fn(); return false; } return true; });
  if (stageBanner > 0) stageBanner--;
  if (flashT > 0) flashT--;
  if (shakeT > 0) shakeT--;
  frame++;
}

// ---------------- 描画 ----------------
function drawBackground() {
  const st = STAGES[stageIdx];
  // 空: 8bit 風の色帯グラデーション
  const bands = 6;
  for (let i = 0; i < bands; i++) {
    ctx.fillStyle = lerpColor(st.sky[0], st.sky[1], i / (bands - 1));
    ctx.fillRect(0, i * H / bands, W, H / bands + 1);
  }

  const px = scrollX * 0.3;
  if (stageIdx === 0) {
    // 太陽
    glow(640, 74, 36, '#fff4c0', 0.35);
    glow(640, 74, 22, '#fff8dc', 0.95);
    // 山並み 2層(遠い方が明るい)
    ctx.fillStyle = '#55b478';
    ridge(scrollX * 0.14, 328, 78, 0.0026, 0.6);
    ctx.fillStyle = '#2f8a55';
    ridge(scrollX * 0.3, 358, 68, 0.0032, 2.2);
    // 2トーンの雲
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260 - scrollX * 0.15) % (W + 200) + W + 200) % (W + 200) - 100;
      const cy = 50 + (i * 47) % 120;
      ctx.fillStyle = '#c8dcf0';
      ctx.fillRect(cx - 40, cy + 2, 80, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 40, cy - 6, 80, 9);
      ctx.fillRect(cx - 22, cy - 13, 46, 8);
      ctx.fillRect(cx - 6, cy - 18, 24, 6);
    }
  } else if (stageIdx === 1) {
    // 奥の岩柱 2層
    ctx.fillStyle = '#1b1b38';
    for (let i = 0; i < 7; i++) {
      const cx = ((i * 190 - scrollX * 0.18) % (W + 180) + W + 180) % (W + 180) - 90;
      ctx.fillRect(cx, 60 + (i * 53) % 120, 46, 400);
      ctx.fillRect(cx + 8, 40 + (i * 53) % 120, 30, 30);
    }
    ctx.fillStyle = '#2a2752';
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 170 - px) % (W + 160) + W + 160) % (W + 160) - 80;
      ctx.fillRect(cx, 90 + (i * 53) % 140, 28, 400);
    }
    // 輝く結晶クラスター
    for (let i = 0; i < 10; i++) {
      const cx = ((i * 149 - scrollX * 0.5) % (W + 60) + W + 60) % (W + 60) - 30;
      const cy = 70 + (i * 97) % 320;
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + i * 2);
      glow(cx, cy, 10, '#9a8aff', 0.12 + tw * 0.15);
      drawDiamond(cx, cy, 6, `rgba(190,170,255,${0.5 + tw * 0.5})`);
      drawDiamond(cx + 7, cy + 5, 4, `rgba(150,130,240,${0.4 + tw * 0.4})`);
    }
  } else if (stageIdx === 2) {
    // オーロラ
    for (let L = 0; L < 2; L++) {
      ctx.fillStyle = L ? 'rgba(150,120,255,0.13)' : 'rgba(90,255,190,0.14)';
      for (let x = 0; x < W; x += 16) {
        const y = 34 + L * 24 + Math.sin(x * 0.009 + frame * 0.02 + L * 2) * 16;
        ctx.fillRect(x, y, 16, 34);
      }
    }
    // 氷峰 2層
    ctx.fillStyle = '#3a5c94';
    ridge(scrollX * 0.15, 300, 105, 0.0031, 1.2);
    ctx.fillStyle = '#4a70b0';
    ridge(scrollX * 0.3, 335, 112, 0.0042, 0);
    // 降る雪
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 53 + Math.sin(frame * 0.01 + i) * 30 - scrollX * 0.4) % W + W) % W;
      const sy = (i * 97 + frame * (1 + (i % 3) * 0.5)) % H;
      ctx.fillRect(sx, sy, 3, 3);
    }
  } else if (stageIdx === 3) {
    // 流れる雲層(上面にハイライト)
    for (let L = 0; L < 3; L++) {
      const sp = 0.4 + L * 0.5;
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 180 + L * 60 - scrollX * sp) % (W + 240) + W + 240) % (W + 240) - 120;
        const cy = 70 + L * 90 + (i * 37) % 50;
        ctx.fillStyle = `rgba(70,76,100,${0.3 + L * 0.14})`;
        ctx.fillRect(cx - 80, cy - 10, 160, 22);
        ctx.fillRect(cx - 50, cy - 20, 100, 12);
        ctx.fillStyle = `rgba(140,150,180,${0.12 + L * 0.08})`;
        ctx.fillRect(cx - 50, cy - 22, 100, 4);
      }
    }
    // 雨
    ctx.strokeStyle = 'rgba(170,190,230,0.3)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 22; i++) {
      const rx = ((i * 67 - frame * 7 - scrollX) % W + W) % W;
      const ry = (i * 131 + frame * 11) % H;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 6, ry + 20);
    }
    ctx.stroke();
    // 稲光
    if ((frame + 37) % 160 < 5) {
      ctx.fillStyle = 'rgba(255,255,240,0.18)';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,200,0.9)'; ctx.lineWidth = 3;
      ctx.beginPath();
      let lx = 100 + (frame * 7919) % 600, ly = 0;
      ctx.moveTo(lx, ly);
      while (ly < 300) { lx += (Math.random() - 0.5) * 60; ly += 40; ctx.lineTo(lx, ly); }
      ctx.stroke();
    }
  } else {
    // 遠景の構造物 2層(窓明かり・警告灯・配管)
    ctx.fillStyle = '#33141b';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 240 - scrollX * 0.15) % (W + 260) + W + 260) % (W + 260) - 130;
      ctx.fillRect(cx, 90 + (i * 61) % 70, 110, 400);
      // 窓明かり
      for (let wy = 0; wy < 5; wy++) {
        for (let wxx = 0; wxx < 3; wxx++) {
          const lit = hash1(i * 97 + wy * 13 + wxx * 7) > 0.45;
          ctx.fillStyle = lit ? '#ffb060' : '#40161e';
          ctx.fillRect(cx + 16 + wxx * 30, 120 + (i * 61) % 70 + wy * 42, 10, 14);
        }
      }
      ctx.fillStyle = '#33141b';
    }
    for (let i = 0; i < 7; i++) {
      const cx = ((i * 200 - px) % (W + 220) + W + 220) % (W + 220) - 110;
      ctx.fillStyle = st.far;
      ctx.fillRect(cx, 120 + (i * 71) % 90, 80, 400);
      ctx.fillStyle = '#5e2630';
      ctx.fillRect(cx, 120 + (i * 71) % 90, 80, 8);
      ctx.fillStyle = (Math.floor(frame / 30) + i) % 2 ? '#ff5040' : '#601010';
      ctx.fillRect(cx + 36, 132 + (i * 71) % 90, 8, 8);
    }
    // 手前の配管
    ctx.fillStyle = '#2a0e13';
    const pipeY = 60;
    ctx.fillRect(0, pipeY, W, 12);
    for (let i = 0; i < 9; i++) {
      const jx = ((i * 110 - scrollX * 0.55) % (W + 40) + W + 40) % (W + 40) - 20;
      ctx.fillRect(jx, pipeY - 3, 10, 18);
    }
  }
}
function drawTerrain() {
  if (arenaT >= 1) return; // ボスアリーナでは地形なし
  const st = STAGES[stageIdx];
  const i0 = Math.floor(scrollX / TSTEP);
  const iN = i0 + Math.ceil(W / TSTEP) + 1;
  const fx = i => i * TSTEP - scrollX;

  // 床: 深部(暗)
  ctx.fillStyle = st.groundDark;
  ctx.beginPath();
  ctx.moveTo(-20, H + 20);
  for (let i = i0; i <= iN; i++) ctx.lineTo(fx(i), floorAt(i * TSTEP));
  ctx.lineTo(W + 20, H + 20);
  ctx.closePath(); ctx.fill();
  // 床: 表層バンド(明)
  ctx.fillStyle = st.ground;
  ctx.beginPath();
  for (let i = i0; i <= iN; i++) {
    const y = floorAt(i * TSTEP);
    i === i0 ? ctx.moveTo(fx(i), y) : ctx.lineTo(fx(i), y);
  }
  for (let i = iN; i >= i0; i--) ctx.lineTo(fx(i), floorAt(i * TSTEP) + 16);
  ctx.closePath(); ctx.fill();
  // 床: エッジ
  ctx.strokeStyle = st.groundEdge; ctx.lineWidth = 3;
  ctx.beginPath();

          ctx.fillRect(e.x - 6.5, e.y - 5 + s * 5, 13, 4);
        }
        // 頭 + 複眼
        ctx.fillStyle = '#6a5010';
        ctx.beginPath(); ctx.arc(e.x, e.y - 9, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#301c04';
        ctx.beginPath(); ctx.arc(e.x - 2, e.y - 10, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e.x + 2, e.y - 10, 1.8, 0, Math.PI * 2); ctx.fill();
        // 針
        ctx.fillStyle = '#e8dcc8';
        ctx.beginPath();
        ctx.moveTo(e.x - 3, e.y + 9); ctx.lineTo(e.x, e.y + 16); ctx.lineTo(e.x + 3, e.y + 9);
        ctx.closePath(); ctx.fill();

      case 'popup': {

        ctx.strokeStyle = '#3a5a48'; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(e.x + sway, Math.min(fy2 + 8, e.y + 40));
        ctx.quadraticCurveTo(e.x - sway, (e.y + fy2) / 2, e.x, e.y + 4);
        ctx.stroke();
        ctx.strokeStyle = '#5a8a68'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(e.x + sway, Math.min(fy2 + 8, e.y + 38));
        ctx.quadraticCurveTo(e.x - sway, (e.y + fy2) / 2, e.x, e.y + 4);

        const jaw2 = e.phase === 2 ? 3 + Math.max(0, Math.sin(e.t2 * 0.11)) * 4 : 1;
        ctx.fillStyle = '#3a5a48';
        ctx.beginPath(); ctx.ellipse(e.x, e.y - 4, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6aa87c';
        ctx.beginPath(); ctx.ellipse(e.x - 1, e.y - 5, 9, 6.5, 0, 0, Math.PI * 2); ctx.fill();
        // 顎
        ctx.fillStyle = '#3a5a48';
        ctx.beginPath();
        ctx.moveTo(e.x - 9, e.y - 3); ctx.lineTo(e.x - 12, e.y + 1 + jaw2); ctx.lineTo(e.x - 2, e.y + 1);
        ctx.closePath(); ctx.fill();
        // 目(発射フェーズで光る)
        const hot = e.phase === 2;
        if (hot) glow(e.x - 5, e.y - 7, 6, '#ffe060', 0.4);

      }
      case 'carrier': {

        const flap2 = Math.sin(e.t * 0.4);
        glow(e.x, e.y + 3, 14, '#ffa040', 0.25 + 0.15 * Math.sin(frame * 0.12));
        // 翅(高速で羽ばたく)
        ctx.fillStyle = 'rgba(255,220,170,0.65)';
        ctx.beginPath();
        ctx.moveTo(e.x - 4, e.y - 6);
        ctx.lineTo(e.x - 12, e.y - 15 - flap2 * 5);
        ctx.lineTo(e.x + 2, e.y - 9);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(e.x + 4, e.y - 6);
        ctx.lineTo(e.x + 12, e.y - 15 + flap2 * 5);
        ctx.lineTo(e.x - 2, e.y - 9);
        ctx.closePath(); ctx.fill();
        // 本体(小さな頭 + 脚)
        ctx.fillStyle = '#8a4808';
        ctx.beginPath(); ctx.arc(e.x, e.y - 7, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#8a4808'; ctx.lineWidth = 2;
        for (let k = -1; k <= 1; k += 2) {
          ctx.beginPath(); ctx.moveTo(e.x + k * 3, e.y - 4);
          ctx.lineTo(e.x + k * 7, e.y + 2); ctx.lineTo(e.x + k * 5, e.y + 8);
          ctx.stroke();
        }
        // 卵嚢(半透明・中でアイテムが明滅)
        const sacP = 1 + Math.sin(e.t * 0.1) * 0.07;
        ctx.fillStyle = 'rgba(255,150,60,0.55)';
        ctx.beginPath(); ctx.ellipse(e.x, e.y + 4, 10 * sacP, 11 * sacP, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#c86818'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(e.x, e.y + 4, 10 * sacP, 11 * sacP, 0, 0, Math.PI * 2); ctx.stroke();
        drawDiamond(e.x, e.y + 4, 4 + Math.sin(frame * 0.2) * 1.2, '#fff0d0');
        // 目
        ctx.fillStyle = '#ffe060';
        ctx.fillRect(e.x - 4, e.y - 9, 2.5, 2.5);
        ctx.fillRect(e.x + 1.5, e.y - 9, 2.5, 2.5);
        break;
      }
    }

function drawBulletsItems() {
  for (const b of bullets) {
    if (b.missile) {
      // 小型ロケット(弾頭 + 推進炎)
      const dn = b.up ? -1 : 1;
      ctx.fillStyle = '#c8ccd8';
      ctx.fillRect(b.x - 4, b.y - 2.5, 9, 5);
      ctx.fillStyle = '#ff8040';
      ctx.fillRect(b.x + 5, b.y - 2.5, 3, 5);
      ctx.fillStyle = Math.floor(frame / 2) % 2 ? '#ffb040' : '#ff7020';
      ctx.fillRect(b.x - 9, b.y - 1.5 - dn * 1.5, 5, 3);
    } else {
      // 発光ボルト
      const vertical = Math.abs(b.vy) > Math.abs(b.vx);
      ctx.fillStyle = 'rgba(90,220,255,0.35)';
      if (vertical) ctx.fillRect(b.x - 2.8, b.y - 8, 5.6, 16);
      else ctx.fillRect(b.x - 8, b.y - 2.8, 16, 5.6);
      ctx.fillStyle = '#e8ffff';
      if (vertical) ctx.fillRect(b.x - 1.4, b.y - 6, 2.8, 12);
      else ctx.fillRect(b.x - 6, b.y - 1.4, 12, 2.8);
    }
  }
  for (const eb of ebullets) {
    // 敵弾: 脈動する二重玉
    const pu = Math.floor(frame / 4) % 2;
    const oc = eb.homing ? (pu ? '#ff70e0' : '#d040b0') : (pu ? '#ffe060' : '#ff9030');
    glow(eb.x, eb.y, eb.r + 4, oc, 0.25);
    ctx.fillStyle = oc;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff8f0';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  for (const it of items) {
    // アイテムカプセル(点滅する枠 + ドット文字)
    const colors = { P: '#ff6060', S: '#60c0ff', M: '#ffb040', B: '#70ffb0', O: '#ffd040', U: '#ff70b0' };
    const c = colors[it.type];
    glow(it.x, it.y, 14, c, 0.2 + 0.12 * Math.sin(it.t * 0.15));
    ctx.fillStyle = Math.floor(it.t / 6) % 2 ? '#ffffff' : c;
    ctx.fillRect(it.x - 11, it.y - 11, 22, 22);
    ctx.fillStyle = '#101828';
    ctx.fillRect(it.x - 8.5, it.y - 8.5, 17, 17);
    drawMini(it.type, it.x + 1, it.y + 1, c);
  }
  for (const p of particles) {
    if (p.ring) { // 衝撃波リング
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1) * 0.8;
      ctx.strokeStyle = p.life > p.maxLife * 0.5 ? '#fff8d0' : '#ffb060';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    const lr = p.life / (p.maxLife || 30);
    ctx.globalAlpha = clamp(lr * 1.4, 0, 1);
    if (p.hot) { // 白→黄→橙→燻りの色変化
      ctx.fillStyle = lr > 0.72 ? '#ffffff' : lr > 0.48 ? '#ffe060' : lr > 0.25 ? '#ff9030' : '#7a4838';
    } else {
      ctx.fillStyle = p.color;
    }
    const sz = lr > 0.5 ? 6 : 4;
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

    ctx.fillRect(152, H - 24, 496 * clamp(boss.hp / boss.maxHp, 0, 1), 10);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(boss.name, W / 2, H - 30);
  }

  if (stageBanner > 0) {
    ctx.globalAlpha = clamp(Math.min(stageBanner, 150 - stageBanner) / 30, 0, 1);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText(st.name, W / 2, 180);
    ctx.globalAlpha = 1;
  }
  if (bossWarnT > 0 && Math.floor(bossWarnT / 15) % 2 === 0) {
    ctx.fillStyle = '#ff4040'; ctx.font = 'bold 34px monospace'; ctx.textAlign = 'center';
    ctx.fillText('WARNING !', W / 2, 200);
  }
}
function drawTextScreen(title, lines, footer) {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);
  // 星
  const rng = mulberry32(42);
  for (let i = 0; i < 80; i++) {
    const x = Math.floor(rng() * W / 4) * 4, y = Math.floor(rng() * H / 4) * 4;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.6 * Math.abs(Math.sin(frame * 0.02 + i))})`;
    ctx.fillRect(x, y, 3, 3);
  }
  ctx.textAlign = 'center';
  if (title) {
    ctx.fillStyle = '#80ccff'; ctx.font = 'bold 30px monospace';
    ctx.fillText(title, W / 2, 90);
  }
  ctx.fillStyle = '#dde'; ctx.font = '16px monospace';
  const y0 = 150;
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y0 + i * 28));
  if (footer && Math.floor(frame / 30) % 2 === 0) {
    ctx.fillStyle = '#ffd060'; ctx.font = '15px monospace';
    ctx.fillText(footer, W / 2, H - 40);
  }
  frame++;
}

// ---------------- メインループ ----------------
function loop() {
  requestAnimationFrame(loop);
  const consume = enterEdge; enterEdge = false;
  if (consume && state !== 'play') SFX.ok();
  ctx = mainCtx; // テキスト画面・HUD は高解像度で描く

  if (state === 'title') {
    drawTextScreen('', [], '');
    // タイトル独自描画
    ctx.fillStyle = '#80ccff';
    ctx.font = 'bold 58px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SONIC RAY', W / 2, 170);
    ctx.fillStyle = '#aab';
    ctx.font = '17px monospace';
    ctx.fillText('- 8bit 横スクロールシューティング 全5ステージ -', W / 2, 210);
    ctx.font = '13px monospace';
    ctx.fillText('移動: ←↑→↓ / WASD   ショット: Z or SPACE', W / 2, 285);
    ctx.fillText('P:パワー S:スピード M:ミサイル B:バリア O:オプション U:1UP', W / 2, 310);
    ctx.fillText(`HI SCORE ${String(hiScore).padStart(7, '0')}`, W / 2, 350);
    if (Math.floor(frame / 30) % 2 === 0) {
      ctx.fillStyle = '#ffd060'; ctx.font = '17px monospace';
      ctx.fillText('PRESS ENTER TO START', W / 2, H - 55);
    }
    if (consume) {
      score = 0; lives = 3;
      player.power = 1; player.speedLv = 0; player.missileLv = 0; player.shield = 0; player.options = 0;
      itemCycle = 0;
      storyLines = STAGES[0].story; storyNext = 'start0'; state = 'story';
    }
  } else if (state === 'story' || state === 'clearstory' || state === 'ending') {
    const title = state === 'ending' ? 'MISSION COMPLETE'
      : state === 'clearstory' ? 'STAGE CLEAR' : STAGES[stageIdx].name;
    drawTextScreen(title, storyLines, 'PRESS ENTER');
    if (consume) {
      if (storyNext === 'title') state = 'title';
      else if (storyNext.startsWith('start')) startStage(+storyNext.slice(5));
      else if (storyNext.startsWith('story')) {
        const ni = +storyNext.slice(5);
        stageIdx = ni;
        storyLines = STAGES[ni].story; storyNext = 'start' + ni; state = 'story';
      }
    }
  } else if (state === 'gameover') {
    drawTextScreen('GAME OVER', [
      '', `SCORE  ${String(score).padStart(7, '0')}`,
      '', 'リオ「……まだだ、まだ終われない……!」',
    ], 'PRESS ENTER');
    if (consume) state = 'title';
  } else if (state === 'play') {
    updatePlay();
    // ワールドを低解像度キャンバスへ描き、拡大転送してピクセル化する
    ctx = octx;
    octx.setTransform(LW / W, 0, 0, LH / H, 0, 0);
    if (shakeT > 0) octx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    drawBackground();
    drawTerrain();
    drawEnemies();
    drawBoss();
    drawPlayer();
    drawBulletsItems();
    octx.setTransform(1, 0, 0, 1, 0, 0);
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(off, 0, 0, W, H);
    ctx = mainCtx;
    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashT * 0.06})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawHUD();
  }

  // 走査線(CRT 風)
  mainCtx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 1; y < H; y += 3) mainCtx.fillRect(0, y, W, 1);
}
genTerrain(0);
loop();
</script>
